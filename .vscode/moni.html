<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    body{
    margin:0;
    padding:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #0f172a, #1e293b);
    color:white;
    overflow:hidden;
    text-align: center;
}


.welcome-container{
    height:100vh;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 80px;
}


.content h1{
    font-size:60px;
    margin-bottom:10px;
    animation:slideLeft 1.5s ease;
}

.content h2{
    font-size:32px;
    color:#38bdf8;
    margin-bottom:20px;
}

.content p{
    font-size:18px;
    width:500px;
    line-height:30px;
    color:#cbd5e1;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:14px 35px;
    background:#38bdf8;
    color:white;
    text-decoration:none;
    border-radius:30px;
    font-size:20px;
    transition:0.4s;
}

.btn:hover{
    background:white;
    color:#0f172a;
    transform:scale(1.1);
}

/* Profile image */
.profile{
    position:relative;
}

.profile img{
    width:400px;
    height: 400px;
    object-fit:cover;
    object-position: top;
    border-radius:20%;
    border:5px solid #38bdf8;
    box-shadow:0 0 25px #38bdf8;
    animation:float 3s ease-in-out infinite;
    transition: 0.5s;
}
.profile img:hover{
    transform: scale(1.05);
    box-shadow: 0 0 45px #38bdf8;
}

/* @keyframes float{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-20px);
    }
    100%{
        transform:translateY(0px);
    }
}

@keyframes slideLeft{
    from{
        opacity:0;
        transform:translateX(-100px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }       
}
*/
</style>
<body>

<div class="welcome-container">

    <div class="content">
        <h1>Hello Everyone!</h1>
       <h2> Welcome to My portfolio</h2>

       

        <a href="C:\Users\monik\OneDrive\Desktop\portfolio\.vscode\port.html" class="btn">
           Enter Portfolio
        </a>
    </div>

    <div class="profile">
        <img src="C:\Users\monik\OneDrive\Desktop\portfolio\.vscode\moniii.jpeg">
    </div>

</div>

</body>
</html>
